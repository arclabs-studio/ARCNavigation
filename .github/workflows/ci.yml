name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Run tests
        run: swift test -v

  lint:
    name: Lint
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache pinned tools
        uses: actions/cache@v4
        with:
          path: .arc-tools
          key: arc-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.arc-tool-versions', 'ARCDevTools/configs/tool-versions') }}

      - name: Install pinned SwiftLint
        run: ./ARCDevTools/scripts/install-tools.sh swiftlint

      - name: Run SwiftLint
        run: .arc-tools/bin/swiftlint lint --strict

  platforms:
    name: Test Platforms
    runs-on: macos-15
    strategy:
      matrix:
        destination:
          - 'generic/platform=iOS'
          - 'platform=macOS'
          - 'generic/platform=tvOS'
          - 'generic/platform=watchOS'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Build for ${{ matrix.destination }}
        run: |
          xcodebuild build \
            -scheme ARCNavigation \
            -destination '${{ matrix.destination }}' \
            -skipPackagePluginValidation
